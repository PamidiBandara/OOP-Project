spring:
  application:
    name: bookshop-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://sewminiyasodara01_db_user:jj8BlkopkktQiEjh@cluster0.dbpjt1q.mongodb.net/bookshop?retryWrites=true&w=majority&appName=Cluster0}
      auto-index-creation: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-environment-very-long-secret-key}
